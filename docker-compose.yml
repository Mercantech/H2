# Dokploy: docker compose up -d --build
# Ingen host-ports. Kun Traefik via labels.
# Host(`h2.mercantec.tech`) → web:80 · /api/* → nginx → api:8080
services:
  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_RUNNING_IN_CONTAINER: "true"
      CORS_ORIGINS: ${CORS_ORIGINS:-https://h2.mercantec.tech}

  web:
    build:
      context: .
      dockerfile: Blazor/Dockerfile
      args:
        API_ENDPOINT: ${API_ENDPOINT:-/api/}
    restart: unless-stopped
    depends_on:
      - api
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.h2-web.rule=Host(`${APP_DOMAIN:-h2.mercantec.tech}`)
      - traefik.http.routers.h2-web.entrypoints=web
      - traefik.http.routers.h2-web.service=h2-web
      - traefik.http.services.h2-web.loadbalancer.server.port=80
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  default:
    name: dokploy-network
    external: true
